name: Check workflow examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify example structure
        run: npm run check:structure
      - name: Install example dependencies
        shell: bash
        run: |
          for workflow in workflows/*; do
            if [ -d "$workflow" ]; then
              npm ci --prefix "$workflow" --ignore-scripts --no-audit --no-fund
            fi
          done
      - name: Check examples
        run: npm run check
      - name: Run tests without live API calls
        run: npm test
